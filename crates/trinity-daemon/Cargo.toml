[package]
name = "trinity-daemon"
description = "Razer Naga Trinity remapper - headless engine (JSON-lines IPC)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
trinity-core = { path = "../trinity-core" }
trinity-app = { path = "../trinity-app" }
trinity-infra = { path = "../trinity-infra" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true

[package.metadata.deb]
name = "razer-trinity-mapper"
maintainer = "4lador <4lador@users.noreply.github.com>"
copyright = "2026, 4lador"
extended-description = """\
Remap the 12 side buttons of the Razer Naga Trinity to keyboard keys at \
the kernel level (evdev grab + uinput injection). Includes an Iced GUI, \
a headless daemon started at login and a CLI (trinity-ctl).\
"""
depends = "libc6, libgcc-s1, libxkbcommon0"
section = "utils"
priority = "optional"
assets = [
    ["target/release/trinity-daemon", "usr/bin/", "755"],
    ["target/release/trinity-ctl", "usr/bin/", "755"],
    ["target/release/trinity-gui", "usr/bin/", "755"],
    ["../../packaging/60-trinity-mapper.rules", "usr/lib/udev/rules.d/", "644"],
    ["../../packaging/trinity-mapper-system.service", "usr/lib/systemd/user/trinity-mapper.service", "644"],
]
