name: CI

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test
      - name: Architecture check
        run: ./scripts/check-architecture.sh
      - name: Language check
        run: ./scripts/check-language.sh

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release
      - name: Package
        run: |
          mkdir -p dist
          cp target/release/trinity-daemon dist/
          cp target/release/trinity-gui dist/
          cp target/release/trinity-ctl dist/
          cp packaging/60-trinity-mapper.rules dist/
          cp packaging/trinity-mapper.service dist/
          tar -czf "razer-trinity-mapper-${{ github.ref_name }}-x86_64.tar.gz" -C dist .
          sha256sum "razer-trinity-mapper-${{ github.ref_name }}-x86_64.tar.gz" \
            > "razer-trinity-mapper-${{ github.ref_name }}-x86_64.tar.gz.sha256"
      - name: Install cargo-deb
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb
      - name: Build .deb
        run: |
          cargo deb -p trinity-daemon
          cp target/debian/razer-trinity-mapper_*.deb .
          for f in razer-trinity-mapper_*.deb; do sha256sum "$f" > "$f.sha256"; done
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            razer-trinity-mapper-*.tar.gz
            razer-trinity-mapper-*.tar.gz.sha256
            razer-trinity-mapper_*.deb
            razer-trinity-mapper_*.deb.sha256
