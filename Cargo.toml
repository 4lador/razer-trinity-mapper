[workspace]
resolver = "3"
members = [
    "crates/trinity-core",
    "crates/trinity-app",
    "crates/trinity-infra",
    "crates/trinity-daemon",
    "crates/trinity-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
